name: Changelog

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # necessário para a Action fazer commit no repo

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout com todo o histórico
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gerar CHANGELOG.md
        run: |
          {
            echo "# Changelog"
            echo
            echo "Gerado automaticamente em $(date +'%d/%m/%Y %H:%M')"
            echo
            git log --pretty=format:"- %ad | %s (%an) [%h]" --date=short
          } > CHANGELOG.md
          cat CHANGELOG.md

      - name: Commit do CHANGELOG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "docs: atualiza CHANGELOG [skip ci]"
          git push
